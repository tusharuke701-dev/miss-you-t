<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>I Miss You ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #12000a,
                #3b001c,
                #12000a
            );
        }

        /* Background hearts */
        .heart {
            position: absolute;
            bottom: -50px;
            font-size: 25px;
            animation: float 7s linear infinite;
            opacity: 0.8;
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Main card */
        .card {
            position: relative;
            z-index: 10;

            width: 90%;
            max-width: 500px;

            padding: 45px 25px;

            text-align: center;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.2);

            border-radius: 25px;

            backdrop-filter: blur(10px);

            box-shadow:
                0 0 30px rgba(255, 0, 80, 0.3);
        }

        .big-heart {
            font-size: 80px;

            animation: heartbeat 1.2s infinite;

            filter: drop-shadow(
                0 0 15px #ff1744
            );
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }

        h1 {
            margin-top: 15px;

            color: white;

            font-size: 45px;

            text-shadow:
                0 0 10px #ff1744,
                0 0 25px #ff1744;
        }

        .subtitle {
            margin-top: 15px;

            color: #ffd6df;

            font-size: 18px;

            line-height: 1.6;
        }

        button {
            margin-top: 25px;

            padding: 14px 30px;

            border: none;
            border-radius: 30px;

            background: #ff1744;

            color: white;

            font-size: 17px;

            cursor: pointer;

            box-shadow:
                0 0 15px #ff1744;

            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.08);
        }

        #message {
            display: none;

            margin-top: 25px;

            color: white;

            font-size: 19px;

            line-height: 1.6;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="big-heart">❤️</div>

        <h1>I Miss You</h1>

        <p class="subtitle">
            Distance may keep us apart,
            but some memories never feel far away. ❤️
        </p>

        <button onclick="showMessage()">
            Open My Message 💌
        </button>

        <p id="message">
            No matter how far you are,
            you are still remembered. ❤️
        </p>

    </div>


    <script>

        function showMessage() {

            document.getElementById("message").style.display = "block";

        }


        function createHeart() {

            const heart = document.createElement("div");

            heart.className = "heart";

            heart.innerHTML = "❤️";

            heart.style.left =
                Math.random() * 100 + "vw";

            heart.style.fontSize =
                (15 + Math.random() * 25) + "px";

            heart.style.animationDuration =
                (5 + Math.random() * 5) + "s";

            document.body.appendChild(heart);

            setTimeout(function() {

                heart.remove();

            }, 10000);
        }


        setInterval(createHeart, 500);

    </script>

</body>
</html>
